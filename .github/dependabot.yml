version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /scripts/ci
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      ci-python-dependencies:
        patterns:
          - "*"
