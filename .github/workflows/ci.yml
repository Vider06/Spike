name: Spike CI

on:
  push:
    branches:
      - '**'

permissions: {}

concurrency:
  group: spike-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    name: Repository hygiene and secret detection
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Install CI scanners
        run: python -m pip install --disable-pip-version-check --requirement scripts/ci/requirements.txt

      - name: Run repository hygiene checks
        run: python scripts/ci/run.py hygiene

      - name: Scan for secrets
        run: python scripts/ci/run.py secrets

  ada-validation:
    name: Ada build, tests, and SPARK proof
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Alire, GNAT, and GPRbuild
        uses: alire-project/setup-alire@fc4c8ce471aa30b3af0d39ce15add1ee9eaf28f2
        with:
          version: "2.1.1"
          toolchain: "gnat_native gprbuild"
          cache: true

      - name: Resolve Ada and SPARK workspace dependencies
        run: alr -n update

      - name: Compile Ada and run every VM test
        run: alr exec -- python scripts/ci/run.py ada

      - name: Run SPARK legality, flow analysis, and proofs
        run: alr exec -- python scripts/ci/run.py prove

      - name: Archive VM build, test, and SPARK diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: vm-ci-diagnostics
          path: build/ci/
          if-no-files-found: warn
          retention-days: 90

  workflow-security:
    name: Workflow lint and security audit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Set up Go for actionlint
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.26.x"
          cache: false

      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Lint workflow YAML and enforce workflow policy
        run: |
          python -m pip install --disable-pip-version-check --requirement scripts/ci/requirements.txt
          python scripts/ci/run.py workflow-lint

      - name: Audit GitHub Actions with zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b
        with:
          version: v1.31.1
          advanced-security: false

  ci-summary:
    name: CI result summary
    if: always()
    needs:
      - repository-hygiene
      - ada-validation
      - workflow-security
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Publish gate summary
        env:
          HYGIENE_RESULT: ${{ needs.repository-hygiene.result }}
          ADA_RESULT: ${{ needs.ada-validation.result }}
          WORKFLOW_SECURITY_RESULT: ${{ needs.workflow-security.result }}
        run: python scripts/ci/run.py summary
